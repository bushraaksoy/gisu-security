<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Soft circular background -->
  <circle cx="60" cy="60" r="56" fill="#E8F5E9"/>
  
  <!-- School building group -->
  <g fill="#7BA882" stroke="none">
    
    <!-- Left wing -->
    <rect x="22" y="58" width="28" height="32" rx="1"/>
    <!-- Left wing windows (2x2) -->
    <rect x="27" y="63" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="38" y="63" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="27" y="74" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="38" y="74" width="7" height="7" rx="1" fill="#E8F5E9"/>
    
    <!-- Right wing -->
    <rect x="70" y="58" width="28" height="32" rx="1"/>
    <!-- Right wing windows (2x2) -->
    <rect x="75" y="63" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="86" y="63" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="75" y="74" width="7" height="7" rx="1" fill="#E8F5E9"/>
    <rect x="86" y="74" width="7" height="7" rx="1" fill="#E8F5E9"/>
    
    <!-- Center tower body -->
    <rect x="42" y="42" width="36" height="48" rx="1"/>
    
    <!-- Roof (triangle) -->
    <path d="M36 42 L60 22 L84 42 Z"/>
    
    <!-- Flag pole -->
    <rect x="58.5" y="12" width="2.5" height="12" rx="0.5"/>
    <!-- Flag -->
    <path d="M61 12 L72 15.5 L61 19 Z"/>
    
    <!-- Clock face -->
    <circle cx="60" cy="52" r="9" fill="#E8F5E9"/>
    <!-- Clock hands -->
    <line x1="60" y1="52" x2="60" y2="46" stroke="#7BA882" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="52" x2="65" y2="55" stroke="#7BA882" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Door (arch) -->
    <path d="M52 90 V72 A8 8 0 0 1 68 72 V90 Z" fill="#5A8F6A"/>
    
    <!-- Base / ground line -->
    <rect x="18" y="88" width="84" height="5" rx="1.5"/>
  </g>
</svg>